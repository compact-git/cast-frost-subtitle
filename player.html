<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cast Frost 動画プレーヤー</title>
<!-- OBS の「ブラウザ」ソースで、URL に http://localhost:ポート/player を入れて使う(幅1920・高さ1080)。
     Cast Frost Web のフリップの「📺 Twitch 動画」を流す。背景は透明。 -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* Twitch は「見えている」ことを自動再生の条件にしているので、縮小・半透明にしない(400×300 ピクセル以上が必要) */
  .tw { position: absolute; border-radius: 10px; overflow: hidden; background: #000; }
  #hint { position: fixed; left: 10px; bottom: 10px; font: 700 15px sans-serif; color: #fff; background: rgba(20, 10, 40, .7);
    padding: 5px 12px; border-radius: 10px; transition: opacity 1s; }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="hint">Cast Frost 動画プレーヤー:準備中…</div>
<script src="/twplay.js"></script>
<script>
(() => {
  'use strict';
  const W = 1920, H = 1080;
  const hint = document.getElementById('hint');
  let hideT = 0;
  function say(t, keep) { hint.textContent = 'Cast Frost 動画プレーヤー:' + t; hint.classList.remove('hide'); clearTimeout(hideT); if (!keep) hideT = setTimeout(() => hint.classList.add('hide'), 5000); }

  const active = new Map();   // key → { parts:[{ d, run, t, L }], t }
  /** 1920×1080 の位置から、このページのそのままの大きさの位置へ(縮小の transform は使わない) */
  function place(d, L) {
    const k = Math.min(innerWidth / W, innerHeight / H) || 1;
    let w = (Number(L.size) || 60) / 100 * W * k, h = (Number(L.size) || 60) / 100 * H * k;
    if (h < 300) { h = 300; w = 300 * 16 / 9; }   // 400×300 ピクセルより小さいと Twitch が自動で再生しないので広げる
    Object.assign(d.style, { width: w + 'px', height: h + 'px',
      left: ((innerWidth - W * k) / 2 + (Number(L.x) || 50) / 100 * W * k - w / 2) + 'px', top: ((innerHeight - H * k) / 2 + (Number(L.y) || 50) / 100 * H * k - h / 2) + 'px' });
  }
  addEventListener('resize', () => active.forEach(a => a.parts.forEach(p => place(p.d, p.L))));
  function start(m) {
    stop(m.key);
    const parts = [];
    for (const L of m.layers || []) {
      const d = document.createElement('div'); d.className = 'tw';
      const part = { d, run: null, t: 0, L };
      place(d, L);
      part.t = setTimeout(() => {   // 「始まる(秒)」
        document.body.appendChild(d);
        // 音量は OBS のミキサー(アプリが合わせる)で下げるので、プレーヤーは 100%
        // クリップは、動画ファイル(mp4)の URL をアプリに頼んで <video> で流す(Twitch の埋め込みは OBS の中で自動再生されないことがあるため)
        part.run = CFTw.run(d, L, { parent: [location.hostname || 'localhost'], volMode: 'external', resolveClip });
      }, Math.max(0, Number(L.start) || 0) * 1000);
      parts.push(part);
    }
    const a = { parts, t: 0 };
    if (!m.hold && m.durMs > 0) a.t = setTimeout(() => stop(m.key), m.durMs);
    active.set(m.key, a);
  }
  function stop(key) {
    const a = active.get(key); if (!a) return;
    active.delete(key); clearTimeout(a.t);
    a.parts.forEach(p => { clearTimeout(p.t); if (p.run) p.run.stop(); p.d.remove(); });
  }
  function stopAll() { [...active.keys()].forEach(k => stop(k)); }

  let wsNow = null, ridN = 0;
  const pend = new Map();
  /** クリップの動画ファイルの URL を、補助exe → アプリ(Twitch の OAuth)に頼む。もらえなければ null(埋め込みで流す) */
  function resolveClip(it) {
    return new Promise(res => {
      if (!wsNow || wsNow.readyState !== 1) { res(null); return; }
      const rid = 'r' + (++ridN) + '_' + Date.now();
      const t = setTimeout(() => { pend.delete(rid); res(null); }, 6000);
      pend.set(rid, url => { clearTimeout(t); res(url || null); });
      wsNow.send(JSON.stringify({ type: 'need-clip', rid, id: it.id, bid: it.bid || '' }));
    });
  }
  let retry = 0;
  function connect() {
    let ws;
    try { ws = new WebSocket(`ws://${location.host}/player-ws`); } catch (e) { setTimeout(connect, 3000); return; }
    wsNow = ws;
    ws.onopen = () => { retry = 0; say('接続OK(フリップのボタンを待っています)'); };
    ws.onmessage = ev => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d && d.type === 'clip-url') { const f = pend.get(d.rid); if (f) { pend.delete(d.rid); f(d.url); } return; }
      if (!d || d.type !== 'vid') return;
      if (d.cmd === 'start') { start(d); say('再生中 🎬'); }
      else if (d.cmd === 'stop') stop(d.key);
      else if (d.cmd === 'stopAll') stopAll();
    };
    ws.onclose = () => { say('補助exe とつながっていません(再接続を待っています)', true); setTimeout(connect, Math.min(10000, 1000 * ++retry)); };
  }
  connect();
})();
</script>
</body>
</html>
